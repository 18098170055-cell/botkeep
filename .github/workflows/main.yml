name: grab

on:
  workflow_dispatch:
    inputs:
      source:
        description: "触发来源(manual / worker)"
        default: manual
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: grab
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  grab:
    if: github.repository_owner == 'a69773365-hue'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .cooldown
          key: grab-state-${{ github.run_id }}
          restore-keys: grab-state-

      - name: Cache sing-box
        if: env.NODE_LINK != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/sing-box-1.14.1
          key: sing-box-1.14.1

      - name: Start proxy
        if: env.NODE_LINK != ''
        env:
          SING_BOX_SHA256: ${{ secrets.SING_BOX_SHA256 }}
        run: |
          npm install --no-audit --no-fund
          python3 scripts/start_proxy.py

      - name: Grab
        env:
          COOKIE: ${{ secrets.COOKIE || vars.COOKIE }}
          BOTKEEP_EMAIL: ${{ secrets.BOTKEEP_EMAIL }}
          BOTKEEP_PASSWORD: ${{ secrets.BOTKEEP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TRIGGER: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'worker' || inputs.source }}
          INCLUDE_NODES: ${{ vars.INCLUDE_NODES || 'node10.botkeep.cloud' }}
          EXCLUDE_NODES: ${{ vars.EXCLUDE_NODES || 'node2-it' }}
          SERVER_NAME: ${{ vars.SERVER_NAME || 'my-project' }}
          RAM_MB: ${{ vars.RAM_MB || '512' }}
          CPU_PERCENT: ${{ vars.CPU_PERCENT || '50' }}
          STORAGE_MB: ${{ vars.STORAGE_MB || '1024' }}
          RUN_SECONDS: ${{ vars.RUN_SECONDS || '240' }}
          INTERVAL_SECONDS: ${{ vars.INTERVAL_SECONDS || '20' }}
        run: node grab.mjs

      - name: Keepalive (re-enable schedule)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/grab.yml/enable" || true

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cooldown
          key: grab-state-${{ github.run_id }}
